<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم - شوب جنوب سينا</title>
    <!-- Tailwind CSS -->
    <script src="https://tailwindcss.com"></script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cloudflare.com">
    <!-- Firebase SDKs -->
    <script src="https://gstatic.com"></script>
    <script src="https://gstatic.com"></script>
</head>
<body class="bg-[#ece6dc] text-gray-800 font-sans min-h-screen flex flex-col p-4">

    <!-- Header -->
    <header class="max-w-4xl w-full mx-auto flex justify-between items-center mb-6">
        <button onclick="window.location.href='index.html'" class="border border-[#113946] text-[#113946] px-4 py-1.5 rounded-full font-bold hover:bg-[#113946] hover:text-white transition">خروج</button>
        <div class="text-center">
            <h1 class="text-2xl font-black text-[#113946]">لوحة التحكم</h1>
            <p class="text-xs text-[#b89b72] font-bold">شوب جنوب سينا</p>
        </div>
    </header>

    <!-- Navigation Tabs -->
    <div class="max-w-4xl w-full mx-auto flex justify-center gap-4 mb-6">
        <button class="bg-[#113946] text-white px-6 py-2 rounded-full font-bold shadow">الطلبات</button>
        <button class="bg-white text-gray-700 border border-gray-300 px-6 py-2 rounded-full font-bold hover:bg-gray-50">المنتجات</button>
    </div>

    <!-- Main Container -->
    <main class="max-w-4xl w-full mx-auto flex-1 space-y-6">
        <!-- Search & Filter Bar -->
        <div class="bg-white p-4 rounded-2xl shadow-sm flex flex-col md:flex-row gap-4 items-center justify-between">
            <div class="relative w-full md:flex-1">
                <span class="absolute inset-y-0 right-0 flex items-center pr-3 text-gray-400">
                    <i class="fas fa-search"></i>
                </span>
                <input type="text" id="searchInput" class="w-full border border-gray-300 rounded-xl pr-10 pl-4 py-2.5 focus:ring-2 focus:ring-[#113946] focus:outline-none" placeholder="ابحث برقم الطلب، اسم العميل، أو رقم الهاتف...">
            </div>
            <select id="filterStatus" class="border border-gray-300 rounded-xl px-4 py-2.5 bg-white focus:ring-2 focus:ring-[#113946] focus:outline-none w-full md:w-auto font-bold text-gray-700">
                <option value="all">كل الحالات</option>
                <option value="تم الطلب">تم الطلب</option>
                <option value="تم الشحن">تم الشحن</option>
                <option value="تم التوصيل">تم التوصيل</option>
            </select>
        </div>

        <!-- Orders Container -->
        <div id="ordersContainer" class="space-y-4">
            <div id="loadingMessage" class="text-center py-12 text-gray-500 font-bold">جاري الاتصال والتعرف الذكي على المتجر...</div>
        </div>
    </main>

    <script>
        let db;
        const ordersContainer = document.getElementById('ordersContainer');
        const searchInput = document.getElementById('searchInput');
        const filterStatus = document.getElementById('filterStatus');
        let allOrders = [];

        // قراءة تلقائية لبيانات المشروع الحالي مباشرة من ملف الصفحة الرئيسية دون كتابة يدوية
        async function fetchConfigAndInit() {
            try {
                const response = await fetch('index.html');
                const text = await response.text();
                
                // استخراج كائن firebaseConfig تلقائياً
                const configMatch = text.match(/firebaseConfig\s*=\s*({[\s\S]*?})/);
                if (configMatch && configMatch[1]) {
                    // تحويل النص إلى كائن جافاسكريبت حقيقي بشكل آمن
                    const cleanConfig = configMatch[1].replace(/'/g, '"').replace(/([a-zA-Z0-9_]+)\s*:/g, '"$1":');
                    const parsedConfig = JSON.parse(cleanConfig);
                    
                    if (!firebase.apps.length) {
                        firebase.initializeApp(parsedConfig);
                    }
                    db = firebase.firestore();
                    fetchOrdersLive();
                } else {
                    document.getElementById('loadingMessage').innerText = "برجاء التأكد من وجود كود Firebase في ملف index.html";
                }
            } catch (e) {
                document.getElementById('loadingMessage').innerText = "فشل في التعرف التلقائي على إعدادات متجرك.";
            }
        }

        function fetchOrdersLive() {
            db.collection('orders').onSnapshot(snapshot => {
                allOrders = [];
                snapshot.forEach(doc => { allOrders.push({ id: doc.id, ...doc.data() }); });
                renderOrdersList();
            }, err => {
                ordersContainer.innerHTML = `<div class="text-center text-red-600 font-bold p-6 bg-red-50 rounded-xl border border-red-200">حدث خطأ في الصلاحيات: ${err.message}<br>يرجى التأكد من تحديث تبويب الـ Rules في لوحة Firebase.</div>`;
            });
        }

        function renderOrdersList() {
            const searchVal = searchInput.value.toLowerCase().trim();
            const statusFilter = filterStatus.value;

            let filtered = allOrders.filter(order => {
                if (statusFilter !== 'all' && (order.status || 'تم الطلب') !== statusFilter) return false;
                const clientName = String(order.name || order.clientName || '').toLowerCase();
                const clientPhone = String(order.phone || order.phoneNumber || '').toLowerCase();
                const orderNum = String(order.orderNumber || order.id || '').toLowerCase();
                return clientName.includes(searchVal) || clientPhone.includes(searchVal) || orderNum.includes(searchVal);
            });

            if (filtered.length === 0) {
                ordersContainer.innerHTML = `<div class="text-center text-gray-500 py-12 font-bold">لا توجد طلبات متطابقة.</div>`;
                return;
            }

            ordersContainer.innerHTML = filtered.map(order => {
                const currentStatus = order.status || 'تم الطلب';
                const whatsappMsg = encodeURIComponent(`مرحبًا أ/ ${order.name || 'عميلنا العزيز'}، يسعدنا تواصلك مع متجر شوب جنوب سينا. طلبك حالته الحالية هي: [${currentStatus}].`);
                
                const items = order.cart || order.products || [];
                const itemsList = items.map(p => `
                    <div class="text-sm text-gray-700 bg-white border border-gray-100 p-2 rounded-lg font-bold flex justify-between">
                        <span>${p.title || p.name || 'منتج'} × ${p.quantity || p.qty || 1}</span>
                    </div>
                `).join('');

                return `
                    <div class="bg-[#f5efe6] rounded-2xl p-5 border border-gray-200 shadow-sm space-y-4 text-right">
                        <div class="flex justify-between items-start">
                            <span class="text-lg font-black text-[#113946]">${order.totalPrice || order.total || 0} ج.م</span>
                            <div>
                                <h3 class="text-base font-black text-gray-900">${order.name || 'بدون اسم'} • ${order.phone || ''}</h3>
                                <p class="text-sm text-gray-600 font-medium">${order.address || ''}</p>
                            </div>
                        </div>

                        ${order.transactionDigits || order.walletNumber || order.transactionNumber ? `
                            <div class="text-xs text-gray-500 border-t border-dashed border-gray-300 pt-2">
                                محفظة • آخر 4 أرقام من رقم المحوّل: <span class="font-bold text-gray-800">${order.transactionDigits || order.walletNumber || ''}</span>
                            </div>
                        ` : ''}

                        <div class="space-y-1.5">${itemsList}</div>

                        <div class="pt-2 border-t border-gray-200 flex flex-col sm:flex-row gap-3 items-center justify-between">
                            <div class="w-full sm:w-1/3">
                                <select onchange="updateStatusDirectly('${order.id}', this.value)" class="w-full bg-white border border-gray-300 rounded-xl p-2 text-sm font-bold focus:ring-2 focus:ring-[#113946] text-center">
                                    <option value="تم الطلب" ${currentStatus === 'تم الطلب' ? 'selected' : ''}>تم الطلب</option>
                                    <option value="تم الشحن" ${currentStatus === 'تم الشحن' ? 'selected' : ''}>تم الشحن</option>
                                    <option value="تم التوصيل" ${currentStatus === 'تم التوصيل' ? 'selected' : ''}>تم التوصيل</option>
                                </select>
                            </div>
                            <div class="flex gap-2 w-full sm:w-auto justify-end">
                                <a href="tel:${order.phone}" class="bg-white border border-gray-300 text-gray-700 px-4 py-2 rounded-xl text-sm font-bold flex items-center gap-1 hover:bg-gray-50 transition">
                                    <i class="fas fa-phone text-green-600"></i> اتصال
                                </a>
                                <a href="https://wa.me{order.phone}?text=${whatsappMsg}" target="_blank" class="bg-green-600 text-white px-4 py-2 rounded-xl text-sm font-bold flex items-center gap-1 hover:bg-green-700 transition">
                                    <i class="fab fa-whatsapp"></i> واتساب
                                </a>
                            </div>
                        </div>
                    </div>`;
            }).join('');
        }

        function updateStatusDirectly(docId, newStatus) {
            db.collection('orders').doc(docId).update({ status: newStatus })
