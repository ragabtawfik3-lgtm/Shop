<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم - شوب جنوب سينا</title>
    <!-- Tailwind CSS -->
    <script src="https://tailwindcss.com"></script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cloudflare.com">
    <!-- Firebase SDKs -->
    <script src="https://gstatic.com"></script>
    <script src="https://gstatic.com"></script>
</head>
<body class="bg-[#ece6dc] text-gray-800 font-sans min-h-screen flex flex-col p-4">

    <!-- Header -->
    <header class="max-w-4xl w-full mx-auto flex justify-between items-center mb-6">
        <button onclick="window.location.href='index.html'" class="border border-[#113946] text-[#113946] px-4 py-1.5 rounded-full font-bold hover:bg-[#113946] hover:text-white transition">خروج</button>
        <div class="text-center">
            <h1 class="text-2xl font-black text-[#113946]">لوحة التحكم</h1>
            <p class="text-xs text-[#b89b72] font-bold">شوب جنوب سينا</p>
        </div>
    </header>

    <!-- Navigation Tabs -->
    <div class="max-w-4xl w-full mx-auto flex justify-center gap-4 mb-6">
        <button class="bg-[#113946] text-white px-6 py-2 rounded-full font-bold shadow">الطلبات</button>
        <button onclick="alert('قسم المنتجات يعمل من خلال السورس الافتراضي لديك')" class="bg-white text-gray-700 border border-gray-300 px-6 py-2 rounded-full font-bold hover:bg-gray-50">المنتجات</button>
    </div>

    <!-- Main Container -->
    <main class="max-w-4xl w-full mx-auto flex-1 space-y-6">
        <!-- Search & Filter Bar -->
        <div class="bg-white p-4 rounded-2xl shadow-sm flex flex-col md:flex-row gap-4 items-center justify-between">
            <div class="relative w-full md:flex-1">
                <span class="absolute inset-y-0 right-0 flex items-center pr-3 text-gray-400">
                    <i class="fas fa-search"></i>
                </span>
                <input type="text" id="searchInput" class="w-full border border-gray-300 rounded-xl pr-10 pl-4 py-2.5 focus:ring-2 focus:ring-[#113946] focus:outline-none" placeholder="ابحث برقم الطلب، اسم العميل، أو رقم الهاتف...">
            </div>
            <select id="filterStatus" class="border border-gray-300 rounded-xl px-4 py-2.5 bg-white focus:ring-2 focus:ring-[#113946] focus:outline-none w-full md:w-auto font-bold text-gray-700">
                <option value="all">كل الحالات</option>
                <option value="تم الطلب">تم الطلب</option>
                <option value="تم الشحن">تم الشحن</option>
                <option value="تم التوصيل">تم التوصيل</option>
            </select>
        </div>

        <!-- Orders Container -->
        <div id="ordersContainer" class="space-y-4">
            <div id="loadingMessage" class="text-center py-12 text-gray-500 font-bold flex flex-col items-center justify-center gap-3">
                <i class="fas fa-spinner fa-spin text-2xl text-[#113946]"></i>
                <span>جاري استخراج التكوين التلقائي وجلب الطلبات الحية...</span>
            </div>
        </div>
    </main>

    <script>
        let db;
        const ordersContainer = document.getElementById('ordersContainer');
        const searchInput = document.getElementById('searchInput');
        const filterStatus = document.getElementById('filterStatus');
        let allOrders = [];

        // خوارزمية ذكية لقراءة الـ Config مباشرة وتخطي حماية المتصفح بدون أي تعديل يدوي منك
        async function autoInitFirebase() {
            try {
                // جلب الصفحة الرئيسية لقراءة الأكواد الداخلية
                const response = await fetch('index.html?v=' + new Date().getTime());
                const htmlText = await response.text();
                
                // البحث عن كائن إعدادات Firebase داخل الكود باستخدام تعبير نمطي متطور
                const match = htmlText.match(/firebaseConfig\s*=\s*{([\s\S]*?)}/);
                
                if (match) {
                    // تحويل النص المستخرج إلى كائن جافاسكريبت حقيقي أوتوماتيكياً
                    const configObj = {};
                    const lines = match[1].split('\n');
                    lines.forEach(line => {
                        const parts = line.split(':');
                        if (parts.length >= 2) {
                            const key = parts[0].replace(/['",\s]/g, '').trim();
                            let value = parts.slice(1).join(':').replace(/['",]/g, '').trim();
                            if (key && value) configObj[key] = value;
                        }
                    });

                    // تفعيل الفايربيز بالبيانات المستخرجة فوراً
                    if (!firebase.apps.length) {
                        firebase.initializeApp(configObj);
                    }
                    db = firebase.firestore();
                    startListeningToOrders();
                } else {
                    // حل بديل في حال كان التكوين مكتوب بطريقة مغايرة
                    document.getElementById('loadingMessage').innerHTML = `<span class="text-red-500">برجاء وضع الكود وتجربته أونلاين على رابط الموقع وليس كملف محلي.</span>`;
                }
            } catch (error) {
                document.getElementById('loadingMessage').innerHTML = `<span class="text-red-500">فشل التوصيل التلقائي. تأكد من رفع الملف على جيت هاب.</span>`;
            }
        }

        function startListeningToOrders() {
            db.collection('orders').orderBy('orderNumber', 'desc').onSnapshot(snapshot => {
                allOrders = [];
                snapshot.forEach(doc => { allOrders.push({ id: doc.id, ...doc.data() }); });
                renderDashboard();
            }, err => {
                ordersContainer.innerHTML = `<div class="text-center text-red-600 font-bold p-6 bg-white rounded-2xl border border-red-200">حدث خطأ في صلاحيات جلب البيانات. يرجى التأكد من تفعيل الـ Rules في Firebase لجعل القراءة متاحة للوحة الإدارة.</div>`;
            });
        }

        function renderDashboard() {
            const searchVal = searchInput.value.toLowerCase().trim();
            const statusFilter = filterStatus.value;

            let filtered = allOrders.filter(order => {
                if (statusFilter !== 'all' && (order.status || 'تم الطلب') !== statusFilter) return false;
                const clientName = String(order.name || order.clientName || '').toLowerCase();
                const clientPhone = String(order.phone || order.phoneNumber || '').toLowerCase();
                const orderNum = String(order.orderNumber || order.id || '').toLowerCase();
                return clientName.includes(searchVal) || clientPhone.includes(searchVal) || orderNum.includes(searchVal);
            });

            if (filtered.length === 0) {
                ordersContainer.innerHTML = `<div class="text-center text-gray-500 py-12 font-bold bg-white rounded-2xl">لا توجد طلبات متطابقة حالياً.</div>`;
                return;
            }

            ordersContainer.innerHTML = filtered.map(order => {
                const currentStatus = order.status || 'تم الطلب';
                const whatsappMsg = encodeURIComponent(`مرحبًا أ/ ${order.name || 'عميلنا العزيز'}، يسعدنا تواصلك مع متجر شوب جنوب سينا. طلبك رقم (${order.orderNumber || ''}) حالته الحالية هي: [${currentStatus}].`);
                
                const items = order.cart || order.products || [];
                const itemsList = items.map(p => `
                    <div class="text-sm text-gray-700 bg-white border border-gray-100 p-2 rounded-lg font-bold flex justify-between items-center shadow-xs">
                        <span>${p.title || p.name || 'منتج'}</span>
                        <span class="bg-gray-100 px-2 py-0.5 rounded text-xs">× ${p.quantity || p.qty || 1}</span>
                    </div>
                `).join('');

                return `
                    <div class="bg-[#f5efe6] rounded-2xl p-5 border border-gray-200 shadow-sm space-y-4 text-right">
                        <div class="flex justify-between items-start">
                            <span class="text-lg font-black text-[#113946]">${order.totalPrice || order.total || 0} ج.م</span>
                            <div>
                                <h3 class="text-base font-black text-gray-900">#${order.orderNumber || '---'} • ${order.name || 'بدون اسم'}</h3>
                                <p class="text-xs text-gray-600 font-bold mt-0.5"><i class="fas fa-phone-alt pl-1"></i> ${order.phone || ''}</p>
                                <p class="text-xs text-gray-500 font-medium mt-1"><i class="fas fa-map-marker-alt pl-1"></i> ${order.address || ''}</p>
                            </div>
                        </div>

                        ${order.transactionDigits || order.walletNumber || order.transactionNumber ? `
                            <div class="text-xs bg-white p-2 rounded-xl text-gray-600 border border-gray-200">
                                <strong>طريقة الدفع:</strong> محفظة إلكترونية (آخر 4 أرقام للمحول: <span class="font-bold text-[#113946]">${order.transactionDigits || order.walletNumber || ''}</span>)
                            </div>
                        ` : ''}

                        <div class="space-y-1.5">${itemsList}</div>

                        <div class="pt-2 border-t border-gray-200 flex flex-col sm:flex-row gap-3 items-center justify-between">
                            <div class="w-full sm:w-1/3">
                                <select onchange="updateStatusDirectly('${order.id}', this.value)" class="w-full bg-white border border-gray-300 rounded-xl p-2 text-sm font-bold focus:ring-2 focus:ring-[#113946] text-center">
