<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>لوحة التحكم · شوب جنوب سينا</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app"></div>
<script type="module">
import {firebaseConfig} from './firebase-config.js';
import {initializeApp} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import {getAuth,signInWithEmailAndPassword,signOut,onAuthStateChanged} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
import {getFirestore,collection,onSnapshot,query,orderBy,doc,setDoc,updateDoc,deleteDoc} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);
// Cloudinary unsigned image uploads
const CLOUDINARY_CLOUD_NAME='kyx68jxf';
const CLOUDINARY_UPLOAD_PRESET='shop_products';
const P=[
{id:1,c:'food',e:'🍯',bg:'#F2C85B',p:180,n:['عسل جبلي من سيناء','Sinai mountain honey']},
{id:2,c:'food',e:'🍵',bg:'#9CC9A1',p:65,n:['أعشاب بدوية للشاي','Bedouin tea herbs']},
{id:3,c:'beach',e:'🤿',bg:'#7CC8D6',p:420,n:['ماسك غطس','Snorkel mask']},
{id:4,c:'beach',e:'👜',bg:'#F0B48A',p:260,n:['شنطة شاطئ قش','Straw beach bag']},
{id:5,c:'fashion',e:'👕',bg:'#D8CDB4',p:350,n:['قميص كتان','Linen shirt']},
{id:6,c:'fashion',e:'👒',bg:'#E7B0A0',p:140,n:['قبعة شمس','Sun hat']},
{id:7,c:'tech',e:'🎧',bg:'#A9B8E0',p:890,n:['سماعات لاسلكية','Wireless earbuds']},
{id:8,c:'tech',e:'⌚',bg:'#B7D3C4',p:1250,n:['ساعة ذكية','Smart watch']}];
const $=s=>document.querySelector(s),A=$('#app');
let user=null,tab='orders',orders=[],prods=[],msg='',unsub=[];
const ST={new:'جديد',confirmed:'تم التأكيد',shipped:'تم الشحن',cancelled:'ملغي'};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';');
const er=e=>{msg=e.message;draw()};
onAuthStateChanged(auth,u=>{user=u;unsub.forEach(f=>f());unsub=[];
 if(u){unsub.push(onSnapshot(query(collection(db,'orders'),orderBy('createdAt','desc')),s=>{orders=s.docs.map(d=>({_id:d.id,...d.data()}));draw()},er));
 unsub.push(onSnapshot(collection(db,'products'),s=>{prods=s.docs.map(d=>d.data());draw()},er))}
 draw()});
const ordersV=()=>orders.length?orders.map(o=>`<div class="row" style="display:block"><b>${esc(o.name)}</b> · ${esc(o.phone)} <span class="price" style="float:inline-end">${esc(o.total)} ج.م</span><div>${esc(o.addr)}</div><div class="note" style="text-align:start">${o.method==='wallet'?'محفظة':'إنستا باي'} · آخر 4 أرقام من رقم المحوِّل: ${esc(o.ref)} · ${esc(o.code)}</div><div>${(o.items||[]).map(i=>esc(i.name[0])+' ×'+esc(i.qty)).join('، ')}</div><select class="in" data-o="${o._id}">${Object.entries(ST).map(([k,v])=>`<option value="${k}" ${o.status===k?'selected':''}>${v}</option>`).join('')}</select></div>`).join(''):'<p class="empty">مفيش طلبات لسه.</p>';
const prodsV=()=>`<div class="box"><b>إضافة منتج</b><label for="n1">الاسم بالعربي</label><input class="in" id="n1"><label for="n2">الاسم بالإنجليزي</label><input class="in" id="n2"><label for="pr">السعر (ج.م)</label><input class="in" id="pr" type="number" inputmode="numeric"><label for="ct">القسم</label><select class="in" id="ct"><option value="food">طعام</option><option value="beach">شاطئ</option><option value="fashion">أزياء</option><option value="tech">إلكترونيات</option></select><label for="em">رمز (إيموجي) — بديل لو مفيش صورة</label><input class="in" id="em" value="🛍️"><label for="photo">صورة المنتج</label><input class="in" id="photo" type="file" accept="image/*"><img id="preview" alt="معاينة صورة المنتج" style="display:none;width:110px;height:110px;object-fit:cover;border-radius:12px;margin-top:8px"><br><br><button class="btn" id="ad">إضافة</button></div>${prods.length?'':'<button class="opt" id="sd">رفع المنتجات التجريبية لقاعدة البيانات</button>'}${[...prods].sort((a,b)=>a.id-b.id).map(p=>`<div class="row"><div class="thumb" style="background:${esc(p.bg)}">${p.img?`<img src="${esc(p.img)}" alt="" style="width:100%;height:100%;object-fit:cover;border-radius:inherit">`:esc(p.e)}</div><div class="i">${esc(p.n[0])}<br><input class="in" type="number" value="${esc(p.p)}" data-p="${p.id}" style="width:110px;padding:4px 8px" aria-label="السعر"></div><div class="q"><button data-v="${p.id}" aria-label="إظهار أو إخفاء">${p.on===false?'🚫':'👁'}</button><button data-d="${p.id}" aria-label="حذف">🗑</button></div></div>`).join('')}`;
function draw(){
 if(!user){A.innerHTML=`<div style="max-width:380px;margin:0 auto;padding:60px 16px"><h2>دخول الأدمن</h2><label for="e">الإيميل</label><input class="in" id="e" type="email" autocomplete="username"><label for="p">الباسورد</label><input class="in" id="p" type="password" autocomplete="current-password"><br><br><button class="btn" id="li">دخول</button><p class="note" id="m"></p></div>`;
 $('#li').onclick=async()=>{try{await signInWithEmailAndPassword(auth,$('#e').value,$('#p').value)}catch(e){$('#m').textContent='الإيميل أو الباسورد غلط'}};return}
 A.innerHTML=`<div style="max-width:720px;margin:0 auto;padding:12px 16px 40px"><header class="top"><div class="brand">لوحة التحكم<small>شوب جنوب سينا</small></div><button class="lang" id="lo">خروج</button></header><div class="chips">${[['orders','الطلبات'],['prods','المنتجات']].map(([k,v])=>`<button class="chip" aria-pressed="${tab===k}" data-t="${k}">${v}</button>`).join('')}</div>${msg?`<p class="note">${esc(msg)}</p>`:''}${tab==='orders'?ordersV():prodsV()}</div>`;
 $('#lo').onclick=()=>signOut(auth);
 A.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{tab=b.dataset.t;msg='';draw()});
 A.querySelectorAll('[data-o]').forEach(s=>s.onchange=()=>updateDoc(doc(db,'orders',s.dataset.o),{status:s.value}).catch(er));
 A.querySelectorAll('[data-p]').forEach(i=>i.onchange=()=>updateDoc(doc(db,'products',i.dataset.p),{p:+i.value}).catch(er));
 A.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{const p=prods.find(x=>x.id==b.dataset.v);updateDoc(doc(db,'products',b.dataset.v),{on:p.on===false}).catch(er)});
 A.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>confirm('تحذف المنتج؟')&&deleteDoc(doc(db,'products',b.dataset.d)).catch(er));
 if($('#photo'))$('#photo').onchange=()=>{const f=$('#photo').files[0],v=$('#preview');if(!f){v.style.display='none';return}if(!f.type.startsWith('image/')){msg='اختار ملف صورة فقط';draw();return}v.src=URL.createObjectURL(f);v.style.display='block'};
  if($('#ad'))$('#ad').onclick=async()=>{const id=Date.now(),n1=$('#n1').value.trim(),n2=$('#n2').value.trim(),price=+$('#pr').value,file=$('#photo')?.files[0];if(!n1||!price){msg='اكتب اسم المنتج والسعر';draw();return}
    const btn=$('#ad');btn.disabled=true;btn.textContent='جارٍ الحفظ...';
    try{let img='';if(file){if(!file.type.startsWith('image/'))throw new Error('الملف المختار ليس صورة');if(file.size>5*1024*1024)throw new Error('حجم الصورة أكبر من 5 ميجابايت');const form=new FormData();form.append('file',file);form.append('upload_preset',CLOUDINARY_UPLOAD_PRESET);form.append('folder','shop-products');const response=await fetch(`https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/image/upload`,{method:'POST',body:form});const result=await response.json();if(!response.ok)throw new Error(result.error?.message||'فشل رفع الصورة إلى Cloudinary');img=result.secure_url;}
      await setDoc(doc(db,'products',String(id)),{id,n:[n1,n2||n1],p:price,c:$('#ct').value,e:$('#em').value||'🛍️',bg:'#E3D6B8',on:true,...(img?{img}:{})});
      msg='تمت إضافة المنتج بنجاح';draw();
    }catch(e){msg='تعذر حفظ المنتج: '+e.message;draw()}
  };
 if($('#sd'))$('#sd').onclick=()=>P.forEach(p=>setDoc(doc(db,'products',String(p.id)),{...p,on:true}).catch(er));
}
</script>
</body>
</html>
